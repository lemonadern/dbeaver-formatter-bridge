name: Build and test

on:
  workflow_call:
    outputs:
      cli_id:
        value: ${{ jobs.cli-package.outputs.artifact-id }}
      plugin_id:
        value: ${{ jobs.windows-dbeaver.outputs.artifact-id }}
      vscode_id:
        value: ${{ jobs.vscode-package.outputs.artifact-id }}
      version:
        value: ${{ jobs.metadata.outputs.version }}
      sha:
        value: ${{ jobs.metadata.outputs.sha }}

permissions:
  contents: read

jobs:
  metadata:
    name: Release tools / Version and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Test release commands and publication state machine
        run: go -C tools/release test -race -timeout 120s ./...
      - name: Verify generated version definitions
        id: version
        run: |
          go run ./scripts/release.go check
          echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  vscode-package:
    needs: metadata
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    name: VSIX / Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install extension development dependencies
        working-directory: extensions/vscode
        run: npm ci --ignore-scripts
      - name: Build VSIX
        working-directory: extensions/vscode
        run: npm run package
      - name: Verify packaged files and licenses
        run: go run ./scripts/ci/verify-vsix.go -write-checksum
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vscode-vsix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.vsix
            dist/VSIX-SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  vscode:
    name: VSIX / ${{ matrix.os }}
    needs: vscode-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.vscode-package.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - name: Verify VSIX
        run: go run ./scripts/ci/verify-vsix.go
      - name: Install extension development dependencies
        working-directory: extensions/vscode
        run: npm ci --ignore-scripts
      - name: Test extension
        working-directory: extensions/vscode
        run: npm test
      - name: Install and test VSIX in real VS Code (Linux)
        if: runner.os == 'Linux'
        working-directory: extensions/vscode
        run: xvfb-run -a npm run test:vsix
      - name: Install and test VSIX in real VS Code (Windows and macOS)
        if: runner.os != 'Linux'
        working-directory: extensions/vscode
        run: npm run test:vsix

  cli:
    needs: metadata
    name: CLI / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Test CLI and race detector
        working-directory: cli
        run: go test -race -timeout 60s ./...
      - name: Test release commands on Windows and macOS
        if: runner.os != 'Linux'
        run: go -C tools/release test -race -timeout 120s ./...
      - name: Vet CLI
        working-directory: cli
        run: go vet ./...
      - name: Test build target URI rules
        run: |
          go test ./scripts/build-plugin.go ./scripts/build-plugin_test.go
          go test ./scripts/prepare-target.go ./scripts/build-plugin_test.go

  cli-package:
    name: CLI / Package
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Cross-build desktop binaries
        run: go run ./scripts/build-cli.go
      - name: Test distribution contents, checksums and tamper rejection
        run: go test -v ./scripts/package-cli.go ./scripts/package-cli_test.go
      - name: Package licensed CLI distributions
        run: go run ./scripts/package-cli.go
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/dbeaver-format-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  windows-dbeaver:
    needs: [metadata, vscode-package]
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    name: Real DBeaver CE 26.2.2 / Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.vscode-package.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - name: Verify VSIX
        run: go run ./scripts/ci/verify-vsix.go
      - name: Install extension test dependencies
        working-directory: extensions/vscode
        run: npm ci --ignore-scripts
      - name: Compile extension test driver
        working-directory: extensions/vscode
        run: npm run compile
      - name: Record runner Maven version
        shell: pwsh
        run: mvn --version
      - name: Build, install and exercise real DBeaver
        shell: pwsh
        run: ./scripts/ci/windows-dbeaver.ps1
      - name: Upload licensed plugin update site
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-update-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: plugin/repository/target/formatter-bridge-update-site-${{ needs.metadata.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload sanitized failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-dbeaver-failure-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-report.txt
          if-no-files-found: warn
          retention-days: 7

  stage:
    name: Release assets / Validate assembly
    needs: [metadata, cli, cli-package, vscode-package, vscode, windows-dbeaver]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.cli-package.outputs.artifact-id }}
          merge-multiple: true
          path: build/release-input/cli
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.windows-dbeaver.outputs.artifact-id }}
          merge-multiple: true
          path: build/release-input/plugin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.vscode-package.outputs.artifact-id }}
          merge-multiple: true
          path: build/release-input/vscode
      - name: Validate nine release assets without remote writes
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: >-
          go run ./scripts/release.go collect
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
          --artifacts build/release-input --out build/release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-assets/*
          if-no-files-found: error
          retention-days: 7
